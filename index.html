<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <script>
      // ==========================================
      // EDIT ONLY THIS ONE LINE TO CHANGE THE TARGET:
      const TARGET_URL = "https://study.iitm.ac.in/es";
      // ==========================================

      function performRedirect() {
        // Appends a random timestamp to bypass GitHub API cache
        fetch("https://api.github.com/repos/SKR-Tek/apex-v2_QR/contents/index.html?t=" + Date.now(), {
          headers: { "Accept": "application/vnd.github.v3.raw" },
          cache: "no-store"
        })
        .then(response => {
          if (!response.ok) throw new Error("Network response failed");
          return response.text();
        })
        .then(htmlText => {
          // Extracts the updated TARGET_URL string from the live raw file
          const match = htmlText.match(/const\s+TARGET_URL\s*=\s*["']([^"']+)["']/);
          const finalUrl = match ? match[1] : TARGET_URL;
          window.location.replace(finalUrl);
        })
        .catch(() => {
          // Fallback if API rate limit or offline occurs
          window.location.replace(TARGET_URL);
        });
      }

      // Forces execution even if pulled from mobile browser RAM cache
      window.addEventListener("pageshow", (event) => {
        if (event.persisted) {
          window.location.reload();
        } else {
          performRedirect();
        }
      });

      performRedirect();
    </script>
  </head>
  <body style="background-color: #000000;"></body>
</html>
