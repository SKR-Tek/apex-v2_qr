<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Redirecting...</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <script>
      // ==========================================
      // EDIT ONLY THIS ONE LINE BELOW:
      const TARGET_URL = "https://www.youtube.com/";
      // ==========================================

      function go() {
        fetch("https://api.github.com/repos/skr-tek.github.io/apex-v2_QR/contents/index.html?t=" + Date.now(), {
          headers: { "Accept": "application/vnd.github.v3.raw" },
          cache: "no-store"
        })
          .then(r => {
            if (!r.ok) throw new Error("Fallback");
            return r.text();
          })
          .then(html => {
            const match = html.match(/const\s+TARGET_URL\s*=\s*["']([^"']+)["']/);
            window.location.replace(match ? match[1] : TARGET_URL);
          })
          .catch(() => {
            window.location.replace(TARGET_URL);
          });
      }

      // Forces mobile browsers to re-run even if pulled from RAM memory
      window.addEventListener("pageshow", go);
      go();
    </script>
  </head>
  <body style="background-color: #000000;"></body>
</html>
